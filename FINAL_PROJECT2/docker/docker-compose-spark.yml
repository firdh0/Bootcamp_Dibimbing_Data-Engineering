
version: '3.8' 

services:
  dibimbing-dataeng-spark-master:
    container_name: ${SPARK_MASTER_CONTAINER_NAME}
    hostname: ${SPARK_MASTER_HOST_NAME}
    image: dataeng-dibimbing/spark 
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      # Hapus SPARK_MODE karena tidak relevan untuk image Apache Spark resmi
      # - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - KAFKA_HOST=${KAFKA_HOST} 
      # - SPARK_DRIVER_MEMORY=1g
    volumes:
      - ../spark-scripts:/spark-scripts
      - ../scripts:/scripts
      - ../logs:/tmp
      - ../streaming-practice:/opt/spark/streaming-practice
      - ../secret:/opt/airflow/secret
    ports:
      - ${SPARK_MASTER_UI}:8080
      - ${SPARK_MASTER_PORT}:7077
    networks:
      - default 

  dibimbing-dataeng-spark-worker-1:
    container_name: ${SPARK_WORKER_CONTAINER_NAME}-1
    image: dataeng-dibimbing/spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://${SPARK_MASTER_HOST_NAME}:${SPARK_MASTER_PORT}"]
    environment:
      # Hapus SPARK_MODE karena tidak relevan
      # - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://${SPARK_MASTER_HOST_NAME}:${SPARK_MASTER_PORT}
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - KAFKA_HOST=${KAFKA_HOST}
    volumes:
      - ../spark-scripts:/spark-scripts
      - ../scripts:/scripts
      - ../logs:/tmp
      - ../streaming-practice:/opt/spark/streaming-practice 
      - ../secret:/opt/airflow/secret
    depends_on:
      - dibimbing-dataeng-spark-master
    networks:
      - default # Pastikan ini dipertahankan

  # dibimbing-dataeng-spark-worker-2: # Jika Anda mengaktifkan worker tambahan
  #   <<: *worker_default # Anda perlu hati-hati dengan anchor/alias jika mengubah command
  #   container_name: ${SPARK_WORKER_CONTAINER_NAME}-2
  #   command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://${SPARK_MASTER_HOST_NAME}:${SPARK_MASTER_PORT}"] # Ulangi command
  #   # Jika menggunakan worker_default, pastikan semua override seperti container_name dan ports dilakukan dengan benar.
  #   # Dan jika Anda memiliki port yang dipetakan, pastikan port host unik (misalnya "8082:8081").

networks:
  default:
    name: dataeng-network
    external: true